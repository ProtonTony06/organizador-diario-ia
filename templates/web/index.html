<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan del día</title>
<meta name="theme-color" content="#191816">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<style>
  :root {
    --fondo: #f4f2ec; --tinta: #2b2a26; --suave: #6f6a5e;
    --linea: #ded9cd; --acento: #2563eb; --tarjeta: #ffffff;
    --hecha: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #191816; --tinta: #e8e4da; --suave: #9a9488;
      --linea: #33302a; --tarjeta: #21201c; --acento: #7aa2ff; --hecha: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 48px; background: var(--fondo);
         color: var(--tinta); font: 16px/1.5 system-ui, sans-serif; }
  /* En el chat la caja de entrada se pega abajo (los 48px son para el pie
     del plan): la clase la pone ponerPestaña() al entrar/salir del Chat.
     El calc de .vista-chat va acorde a este 10px, sin scroll fantasma. */
  body.en-chat { padding-bottom: 10px; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .meta { color: var(--suave); font-size: .9rem; margin-bottom: 16px; }
  .grupo { margin: 18px 0 8px; font-size: .85rem; letter-spacing: .06em;
           text-transform: uppercase; color: var(--suave); }
  .bloque { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
            margin-bottom: 8px; border-radius: 10px; background: var(--tarjeta);
            border: 1px solid var(--linea); }
  .bloque.ancla { opacity: .55; }
  .bloque.descanso { opacity: .6; font-size: .95rem; padding-top: 7px; padding-bottom: 7px; }
  .bloque.cerrada { opacity: .5; border-color: var(--hecha); }
  .bloque.cerrada .texto { text-decoration: line-through; }
  .hora { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 11ch; }
  .texto { flex: 1; }
  .categoria { font-size: .78rem; color: var(--suave); }
  .muted { color: var(--suave); font-weight: 400; }
  button { border: 1px solid var(--linea); background:var(--tarjeta); color: var(--tinta);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button.cerrar:hover { border-color: var(--hecha); color: var(--hecha); }
  button[disabled] { opacity: .4; cursor: default; }
  .estado { margin: 12px 0; padding: 10px 14px; border-radius: 10px;
            border: 1px solid var(--linea); background: var(--tarjeta); display: none; }
  .estado.visible { display: block; }
  .estado.error { border-color: #dc2626; color: #dc2626; }
  blockquote { margin: 18px 0 0; padding: 10px 14px; border-left: 3px solid var(--acento);
               background: var(--tarjeta); border-radius: 0 10px 10px 0; color: var(--suave); }
  .vacio { color: var(--suave); }
  button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  footer { margin-top: 28px; padding-top: 10px; border-top: 1px solid var(--linea);
           color: var(--suave); font-size: .78rem; line-height: 1.5; }

  /* Pestañas (Plan · Chat): segmento arriba, mismas tokens que el resto. */
  .pestañas { display: flex; gap: 4px; padding: 4px; margin-bottom: 14px;
              border: 1px solid var(--linea); border-radius: 10px; background: var(--tarjeta); }
  .pestañas button { flex: 1; background: transparent; border: none; border-radius: 7px;
                     padding: 8px 10px; color: var(--suave); font-weight: 500; }
  .pestañas button.activa { color: var(--acento); font-weight: 600;
                            background: var(--tarjeta);
                            background: color-mix(in srgb, var(--acento) 16%, transparent); }

  /* Vista chat: columna a pantalla (cabeza fuera), mensajes con scroll propio
     y la caja de entrada fija abajo. color-mix sin soporte cae en --tarjeta.
     La resta (96px) es: padding-top del body (20) + pestañas (~64) + los
     10px de body.en-chat, con margen pequeño de holgura → la caja queda a
     ~10-19px del borde inferior sin scroll de página. */
  .vista-chat { display: flex; flex-direction: column;
                height: calc(100vh - 96px); height: calc(100dvh - 96px);
                min-height: 320px; }
  .vista-chat[hidden] { display: none; }
  .chat-hilo { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
               padding: 4px 2px 12px; }
  /* Scroll sin barrita visual, SOLO en el chat (el scroll del plan queda igual):
     rueda y táctil siguen; scrollbar-width es el estándar (Firefox) y
     ::-webkit-scrollbar cubre Chromium/WebView de Android. */
  .chat-hilo, .chat-entrada, .chat-entrada textarea { scrollbar-width: none; }
  .chat-hilo::-webkit-scrollbar,
  .chat-entrada::-webkit-scrollbar,
  .chat-entrada textarea::-webkit-scrollbar { display: none; }
  .mensaje { display: flex; flex-direction: column; max-width: 88%; }
  .mensaje.mío { align-self: flex-end; align-items: flex-end; }
  .mensaje.suyo { align-self: flex-start; align-items: flex-start; }
  .burbuja { padding: 9px 13px; border-radius: 14px; font-size: .95rem; line-height: 1.45;
             word-break: break-word; }
  .burbuja.antonio { background: var(--tarjeta);
                     background: color-mix(in srgb, var(--acento) 18%, var(--tarjeta));
                     border-top-right-radius: 4px; }
  .burbuja.agente { background: var(--tarjeta); border: 1px solid var(--linea);
                    border-top-left-radius: 4px; }
  .burbuja.error { background: var(--tarjeta); border: 1px solid #dc2626; color: #dc2626; }
  .pensando { display: inline-flex; gap: 5px; align-items: center; align-self: flex-start;
              padding: 12px 15px; background: var(--tarjeta); border: 1px solid var(--linea);
              border-radius: 14px; border-top-left-radius: 4px; }
  .pensando[hidden] { display: none; } /* la clase pisa el display:none de la UA: sin esto, los puntitos se quedan SIEMPRE visibles */
  /* Turnos separados: aire puro (ni línea ni hora, petición de Antonio).
     TODO cambio de autor entre mensajes consecutivos abre ronda (yo hablo →
     aire → responde el agente → aire → yo…); el "error" también es cambio
     de autor, se separa igual. El mismo autor seguido: queda pegado. */
  .mensaje.abre { margin-top: 16px; }
  .pensando span { width: 6px; height: 6px; border-radius: 50%; background: var(--suave);
                   animation: palpitar 1.2s infinite; }
  .pensando span:nth-child(2) { animation-delay: .2s; }
  .pensando span:nth-child(3) { animation-delay: .4s; }
  @keyframes palpitar {
    0%, 80%, 100% { opacity: .25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-3px); }
  }
  .chat-entrada { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .chat-entrada textarea { flex: 1; resize: none; max-height: 120px; overflow-y: auto;
                           padding: 9px 12px; border: 1px solid var(--linea);
                           border-radius: 10px; background: var(--tarjeta);
                           color: var(--tinta); font: inherit; line-height: 1.45; }
  .chat-entrada textarea:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .chat-entrada button { padding: 9px 14px; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <nav class="pestañas" aria-label="Cambiar entre Plan y Chat">
    <button type="button" id="pestañaPlan" class="activa" aria-pressed="true">Plan</button>
    <button type="button" id="pestañaChat" aria-pressed="false">Chat</button>
  </nav>

  <section id="vistaPlan">
    <h1>Plan del día</h1>
    <div class="meta" id="meta">cargando…</div>
    <div class="estado" id="estado"></div>
    <div id="contenido" class="vacio">cargando…</div>
    <footer>
      Cómo instalar la app:
      <strong>Android</strong>: menú del navegador → «Añadir a pantalla de inicio».
      <strong>iOS</strong>: botón Compartir → «Añadir a pantalla de inicio».
    </footer>
  </section>

  <section id="vistaChat" class="vista-chat" hidden>
    <h1>Chat</h1>
    <div class="meta">El agente escucha y aprende tu rutina · sin planificar</div>
    <div class="estado" id="avisoChat"></div>
    <div id="chatHilo" class="chat-hilo" role="log" aria-label="Conversación de hoy" aria-live="polite">
      <div id="chatMensajes" class="vacio">cargando…</div>
      <div class="pensando" id="chatPensando" hidden aria-label="El agente está pensando">
        <span></span><span></span><span></span>
      </div>
    </div>
    <form class="chat-entrada" id="chatFormulario">
      <textarea id="chatTexto" rows="1" maxlength="2000" aria-label="Mensaje para el agente"
                placeholder="Cuéntale qué estás haciendo…"></textarea>
      <button type="submit" id="chatEnviar">Enviar</button>
    </form>
  </section>
</main>
<script>
let temporizador = null;
let replanPrevio = null;
const CATEGORIAS = {foco: "Foco", personal: "Personal", descanso: "Descanso", ancla: "Fija"};

function escapar(texto) {
  return String(texto).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function pintar(plan) {
  const contenido = document.getElementById("contenido");
  const meta = document.getElementById("meta");
  if (!plan.hay_plan) {
    meta.textContent = plan.fecha;
    contenido.textContent = plan.mensaje || "Sin plan para hoy.";
    return;
  }
  meta.textContent = `generado a las ${plan.generado || "?"} · refresco automático cada 20 s`;
  const porGrupo = new Map();
  for (const b of plan.bloques) {
    const clave = b.inicio < "12:00" ? "Mañana" : (b.inicio >= "12:00" && b.inicio < "19:00" ? "Tarde" : "Noche");
    if (!porGrupo.has(clave)) porGrupo.set(clave, []);
    porGrupo.get(clave).push(b);
  }
  let html = "";
  for (const [clave, bloques] of porGrupo) {
    html += `<div class="grupo">${clave}</div>`;
    for (const b of bloques) {
      const clase = ["bloque", b.tipo, b.cerrada ? "cerrada" : ""].filter(Boolean).join(" ");
      const cat = b.planificada ? `<span class="categoria">${CATEGORIAS[b.tipo] || b.tipo}</span> ` : "";
      const texto = b.cerrada ? `${b.texto_tarea || b.titulo} ✓` : (b.texto_tarea || b.titulo || "—");
      const enReplan = plan.replan === "ejecutando";
      const nombre = escapar(b.texto_tarea || b.titulo || b.tarea || "");
      const boton = (b.planificada && !b.cerrada)
        ? (enReplan
          ? `<button class="cerrar" data-id="${b.tarea}" disabled title="Re-plan en marcha: espera a que termine" aria-label="Re-plan en marcha: aún no se puede cerrar ${nombre}">✓</button>`
          : `<button class="cerrar" data-id="${b.tarea}" title="Marca la tarea como hecha" aria-label="Marcar como hecha: ${nombre}">✓</button>`)
        : "";
      html += `<div class="${clase}">
        <span class="hora">${b.inicio}–${b.fin}</span>
        <span class="texto">${cat}${texto}</span>
        ${boton}
      </div>`;
    }
  }
  if (plan.no_caben && plan.no_caben.length) {
    html += `<div class="grupo">Sin hueco hoy</div>`;
    for (const t of plan.no_caben)
      html += `<div class="bloque"><span class="texto">[${t.categoria}] ${t.texto}</span></div>`;
  }
  if (plan.pendientes_sin_bloque && plan.pendientes_sin_bloque.length) {
    html += `<div class="grupo">Pendientes fuera del plan</div>`;
    for (const t of plan.pendientes_sin_bloque)
      html += `<div class="bloque ancla" title="Pendiente en el inbox: el plan no le dio hueco hoy">
        <span class="hora muted">·</span>
        <span class="texto">${t.texto} <span class="categoria">· ${t.categoria}</span></span>
      </div>`;
  }
  if (plan.comentario) html += `<blockquote>${plan.comentario}</blockquote>`;
  contenido.innerHTML = html;
}

async function cerrarTarea(evento) {
  const boton = evento.target.closest("button.cerrar");
  if (!boton || boton.disabled) return;
  boton.disabled = true;
  try {
    const respuesta = await fetch(`/api/tarea/${boton.dataset.id}/cerrar`, {method: "POST"});
    if (!respuesta.ok) throw new Error(await respuesta.text());
    mostrarEstado("Tarea cerrada: re-planificando el resto del día…");
  } catch (error) {
    mostrarEstado("No se pudo cerrar la tarea: " + error.message, true);
  }
  refrescar();
}

function mostrarEstado(texto, esError = false) {
  const caja = document.getElementById("estado");
  caja.textContent = texto;
  caja.className = "estado visible" + (esError ? " error" : "");
}

async function refrescar() {
  try {
    const plan = await (await fetch("/api/plan")).json();
    pintar(plan);
    const caja = document.getElementById("estado");
    if (plan.replan === "ejecutando") {
      replanPrevio = "ejecutando";
      mostrarEstado("Re-planificando el resto del día (el modelo tarda 1–3 min)…");
    } else if (plan.replan === "listo") {
      const acababaDeReplan = replanPrevio === "ejecutando";
      replanPrevio = null;
      caja.className = "estado";
      if (acababaDeReplan) setTimeout(refrescar, 1500); // refresco inmediato tras terminar el re-plan
    } else if (plan.replan === "error") {
      replanPrevio = null;
      mostrarEstado("El re-plan falló: revisa el servidor.", true);
    }
  } catch {
    document.getElementById("contenido").textContent = "Servidor no alcanzable.";
  }
}

/* ---------- Chat (fase de aprendizaje: escuchar y aprender, sin plan) ----------
   DECISIÓN DE POLL: el poll del plan (20 s) sigue corriendo también en la
   pestaña Chat: es un GET pequeño de JSON y así el plan nunca queda viejo
   sin sumar estado extra. El poll del chat solo corre con su pestaña abierta
   (al salir se cancela) y es adaptativo: 3 s mientras estado === "pensando",
   10 s el resto (setTimeout en cadena, no setInterval). */

let chatTemporizador = null;
let chatEstado = "idle";

function htmlMensaje(mensaje, abreTurno = false) {
  // "error" ya llega como mensaje con autor "error": burbuja roja a la izq.
  // El campo "acciones" (registrar/aprender) del JSON se IGNORA al pintar a
  // petición de Antonio: el agente lo sigue registrando el backend igual,
  // pero en la web solo se ve la conversación (se revisará más adelante).
  // Antonio no quiere ver horas: ni separador, ni hover con título (ts no se
  // usa en el render). Los separadores son solo aire: mire .mensaje.abre.
  const autor = mensaje.autor === "antonio" ? "antonio" : (mensaje.autor === "error" ? "error" : "agente");
  const cuerpo = escapar(mensaje.texto).replace(/\n/g, "<br>");
  return `<div class="mensaje ${autor === "antonio" ? "mío" : "suyo"}${abreTurno ? " abre" : ""}">
    <div class="burbuja ${autor}">${cuerpo}</div>
  </div>`;
}

let avisoHasta = 0; // ms epoch: el aviso de un 4xx sobrevive ≥1 ciclo de poll

function mostrarAviso(texto, esError = false, caducaEn = 0) {
  if (texto) avisoHasta = Date.now() + caducaEn;
  const caja = document.getElementById("avisoChat");
  caja.textContent = texto;
  caja.className = "estado" + (texto ? " visible" : "") + (esError ? " error" : "");
}

function programarChatPoll() {
  clearTimeout(chatTemporizador);
  // La continuación de un refrescarChat en vuelo llega AQUÍ también cuando
  // el usuario ya volvió al Plan (ponerPestaña limpió el temporizador): si la
  // vista está oculta, no rearmes el poll o volvería a vida por su cuenta.
  if (document.getElementById("vistaChat").hidden) return;
  chatTemporizador = setTimeout(refrescarChat, chatEstado === "pensando" ? 3000 : 10000);
}

async function refrescarChat() {
  clearTimeout(chatTemporizador);
  try {
    // ¿Estaba leyendo por el fondo? Mido ANTES de repintar (alturas cambian).
    const hilo = document.getElementById("chatHilo");
    const pegadoAbajo = hilo.scrollHeight - hilo.scrollTop - hilo.clientHeight < 80;
    const datos = await (await fetch("/api/chat")).json();
    chatEstado = datos.estado || "idle";
    const contenedor = document.getElementById("chatMensajes");
    const mensajes = Array.isArray(datos.mensajes) ? datos.mensajes : [];
    contenedor.className = mensajes.length ? "" : "vacio";
    let html = "";
    let previo = null; // autor del mensaje anterior, para saber si abre turno
    for (const m of mensajes) {
      // Separación en TODO cambio de autor (antonio→agente, antonio→error,
      // agente→antonio…): la burbuja que abre ronda lleva margen extra de
      // aire, sin línea ni hora. El mismo autor seguido queda pegado.
      html += htmlMensaje(m, previo !== null && m.autor !== previo);
      previo = m.autor;
    }
    contenedor.innerHTML = mensajes.length
      ? html
      : "Aún no habéis hablado hoy.";
    document.getElementById("chatPensando").hidden = chatEstado !== "pensando";
    if (Date.now() >= avisoHasta) mostrarAviso(""); // el aviso fresco (409…) no se borra
    if (pegadoAbajo) hilo.scrollTop = hilo.scrollHeight; // releer arriba no te arrastra
  } catch {
    // Degrada con gracia si /api/chat aún no existe: aviso rojo y, si nunca
    // cargó nada, fuera el "cargando…" que quedaría colgado para siempre.
    const sinDatos = document.getElementById("chatMensajes");
    if (sinDatos.textContent === "cargando…") { sinDatos.textContent = "sin conexión"; sinDatos.className = "vacio"; }
    document.getElementById("chatPensando").hidden = true; // sin estado REAL, no digas que piensa
    mostrarAviso("Servidor no alcanzable.", true);
  }
  programarChatPoll();
}

function ajustarCaja(campo) {
  campo.style.height = "auto";
  campo.style.height = Math.min(campo.scrollHeight, 120) + "px";
}

async function enviarChat() {
  const campo = document.getElementById("chatTexto");
  const boton = document.getElementById("chatEnviar");
  const texto = campo.value.trim();
  if (!texto) return;
  if (texto.length > 2000) { // el pydantic del servidor corta en 2000; no desperdicies el turno
    mostrarAviso("El mensaje es demasiado largo (máximo 2000 caracteres).", true, 15000);
    return;
  }
  boton.disabled = true;
  try {
    const respuesta = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({texto}),
    });
    if (respuesta.status === 409) {
      mostrarAviso("El agente sigue pensando el mensaje anterior: espera un momento.", true, 15000);
    } else if (!respuesta.ok) {
      mostrarAviso("No se pudo enviar el mensaje (error " + respuesta.status + ").", true, 15000);
    } else {
      campo.value = "";
      ajustarCaja(campo);
      mostrarAviso("");
      chatEstado = "pensando"; // poll rápido sin esperar al primer refresco
      programarChatPoll();
      await refrescarChat();
    }
  } catch {
    mostrarAviso("Servidor no alcanzable.", true);
  } finally {
    boton.disabled = false;
  }
}

/* ---------- Pestañas (Plan · Chat) ---------- */

function ponerPestaña(nombre, guardar) {
  const esChat = nombre === "chat";
  // En el chat el body se estrecha por abajo (body.en-chat, ver CSS).
  document.body.classList.toggle("en-chat", esChat);
  document.getElementById("pestañaPlan").classList.toggle("activa", !esChat);
  document.getElementById("pestañaChat").classList.toggle("activa", esChat);
  document.getElementById("pestañaPlan").setAttribute("aria-pressed", String(!esChat));
  document.getElementById("pestañaChat").setAttribute("aria-pressed", String(esChat));
  document.getElementById("vistaPlan").hidden = esChat;
  document.getElementById("vistaChat").hidden = !esChat;
  if (guardar) {
    try { localStorage.setItem("pestaña", nombre); } catch { /* sin storage: pestaña efímera */ }
  }
  if (esChat) refrescarChat();
  else clearTimeout(chatTemporizador); // fuera del chat no hay poll (ver arriba)
}

document.getElementById("pestañaPlan").addEventListener("click", () => ponerPestaña("plan", true));
document.getElementById("pestañaChat").addEventListener("click", () => ponerPestaña("chat", true));
document.getElementById("chatFormulario").addEventListener("submit", (evento) => {
  evento.preventDefault();
  enviarChat();
});
document.getElementById("chatTexto").addEventListener("keydown", (evento) => {
  if (evento.key === "Enter" && !evento.shiftKey) {
    evento.preventDefault();
    document.getElementById("chatFormulario").requestSubmit();
  }
});
document.getElementById("chatTexto").addEventListener("input", (evento) => ajustarCaja(evento.target));

/* Plan: poll fijo de 20 s, vivo en las dos pestañas (ver decisión arriba). */
refrescar();
document.getElementById("contenido").addEventListener("click", cerrarTarea);
temporizador = setInterval(refrescar, 20000);

/* Pestaña inicial: la guardada si hay suerte; Plan si localStorage falla. */
let inicial = "plan";
try {
  const guardada = localStorage.getItem("pestaña");
  if (guardada === "plan" || guardada === "chat") inicial = guardada;
} catch { /* sin storage: Plan */ }
ponerPestaña(inicial, false);
</script>
</body>
</html>
