<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<style>
  :root {
    --fondo: #f4f2ec; --tinta: #2b2a26; --suave: #6f6a5e;
    --linea: #ded9cd; --acento: #2563eb; --tarjeta: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #191816; --tinta: #e8e4da; --suave: #9a9488;
      --linea: #33302a; --tarjeta: #21201c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--fondo);
    color: var(--tinta); font: 16px/1.55 system-ui, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 16px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: var(--tarjeta); border: 1px solid var(--linea);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
  }
  strong { font-variant-numeric: tabular-nums; }
  em { color: var(--suave); font-style: normal; font-size: .925rem; }
  a { color: var(--acento); }
  blockquote {
    margin: 16px 0 0; padding: 10px 14px; border-left: 3px solid var(--acento);
    background: var(--tarjeta); border-radius: 0 10px 10px 0; color: var(--suave);
  }
  h2 { font-size: 1.05rem; margin: 24px 0 8px; }
</style>
</head>
<body>
<main>
<h1>{{TITULO}}</h1>
{{CONTENIDO}}
</main>
</body>
</html>
